name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar variables de prueba
        run: cp .env.example .env

      - name: Construir y levantar los servicios
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Probar guardado y lectura en la base de datos
        run: npm run test:integration

      - name: Mostrar registros si falla la ejecución
        if: failure()
        run: docker compose logs --no-color

      - name: Detener servicios
        if: always()
        run: docker compose down --volumes --remove-orphans
