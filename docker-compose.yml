services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Define DB_NAME en el archivo .env}
      DB_USER: ${DB_USER:?Define DB_USER en el archivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gestor-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en el archivo .env}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD en el archivo .env}
      DB_USER: ${DB_USER:?Define DB_USER en el archivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    expose:
      - "5432"
    networks:
      - gestor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  gestor-network:
    driver: bridge
